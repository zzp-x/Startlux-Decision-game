[project]
name = "jev-mario"
version = "0.1.0"
description = "Jev (TypeSafe) plays Super Mario Bros 1-1 from a text grid of the RAM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-super-mario-bros==7.4.0",
    "nes-py==8.2.1",
    "gym==0.26.2",
    "numpy<2",
    "httpx>=0.27",
    "imageio>=2.34",
    "pillow>=10",
]
